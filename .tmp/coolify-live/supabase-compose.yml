services:
  supabase-kong:
    image: 'kong:2.8.1'
    entrypoint: 'bash -c ''eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'''
    depends_on:
      supabase-analytics:
        condition: service_healthy
    environment:
      SERVICE_URL_SUPABASEKONG_8000: 'https://api.dextery.dev:8000'
      KONG_PORT_MAPS: '443:8000'
      JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: 'LAST,A,CNAME'
      KONG_PLUGINS: 'request-transformer,cors,key-auth,acl,basic-auth'
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: '64 160k'
      SUPABASE_ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      SUPABASE_SERVICE_KEY: '${SERVICE_SUPABASESERVICE_KEY}'
      DASHBOARD_USERNAME: '${SERVICE_USER_ADMIN}'
      DASHBOARD_PASSWORD: '${SERVICE_PASSWORD_ADMIN}'
      KONG_STORAGE_CONNECT_TIMEOUT: '60'
      KONG_STORAGE_WRITE_TIMEOUT: '3600'
      KONG_STORAGE_READ_TIMEOUT: '3600'
      KONG_STORAGE_REQUEST_BUFFERING: 'false'
      KONG_STORAGE_RESPONSE_BUFFERING: 'false'
      COOLIFY_RESOURCE_UUID: qvorfovjsiinni7o8azmlluz
      COOLIFY_CONTAINER_NAME: supabase-kong-qvorfovjsiinni7o8azmlluz
      COOLIFY_FQDN: api.dextery.dev
      COOLIFY_URL: 'https://api.dextery.dev'
      SERVICE_NAME_SUPABASE_KONG: supabase-kong
      SERVICE_NAME_SUPABASE_STUDIO: supabase-studio
      SERVICE_NAME_SUPABASE_DB: supabase-db
      SERVICE_NAME_SUPABASE_ANALYTICS: supabase-analytics
      SERVICE_NAME_SUPABASE_VECTOR: supabase-vector
      SERVICE_NAME_SUPABASE_REST: supabase-rest
      SERVICE_NAME_SUPABASE_AUTH: supabase-auth
      SERVICE_NAME_REALTIME_DEV: realtime-dev
      SERVICE_NAME_SUPABASE_MINIO: supabase-minio
      SERVICE_NAME_MINIO_CREATEBUCKET: minio-createbucket
      SERVICE_NAME_SUPABASE_STORAGE: supabase-storage
      SERVICE_NAME_IMGPROXY: imgproxy
      SERVICE_NAME_SUPABASE_META: supabase-meta
      SERVICE_NAME_SUPABASE_EDGE_FUNCTIONS: supabase-edge-functions
      SERVICE_NAME_SUPABASE_SUPAVISOR: supabase-supavisor
