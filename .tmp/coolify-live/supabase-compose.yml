  supabase-image-cache:
    image: 'node:20-alpine'
    container_name: supabase-image-cache-qvorfovjsiinni7o8azmlluz
    restart: unless-stopped
    command:
      - node
      - /app/server.mjs
    environment:
      PORT: '8080'
      SUPABASE_KONG_UPSTREAM: 'http://supabase-kong:8000'
      SUPABASE_IMAGE_CACHE_REDIS_URL: '${SUPABASE_IMAGE_CACHE_REDIS_URL}'
    volumes:
      - '/data/coolify/services/qvorfovjsiinni7o8azmlluz/volumes/image-cache/server.mjs:/app/server.mjs:ro'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:8080/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=qvorfovjsiinni7o8azmlluz
      - traefik.http.routers.http-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.entryPoints=http
      - traefik.http.routers.http-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.middlewares=redirect-to-https
