      - traefik.http.routers.http-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.service=http-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache
      - traefik.http.routers.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.entryPoints=https
      - traefik.http.routers.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.middlewares=gzip
      - 'traefik.http.routers.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.rule=Host(`api.dextery.dev`) && PathPrefix(`/storage/v1/render/image/public/`)'
      - traefik.http.routers.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.priority=1000
      - traefik.http.routers.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.service=https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache
      - traefik.http.routers.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.tls.certresolver=letsencrypt
      - traefik.http.routers.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.tls=true
      - traefik.http.services.http-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.loadbalancer.server.port=8080
      - traefik.http.services.https-1-qvorfovjsiinni7o8azmlluz-supabase-image-cache.loadbalancer.server.port=8080
